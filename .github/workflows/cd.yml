# Wheel matrix generated from `maturin generate-ci github`, then pruned: the
# free-threaded (python3.14t) build steps were removed since this project ships
# abi3 (CPython-only, no free-threading) wheels, and action refs were pinned to
# their current major versions. Re-run the generator and re-apply these changes
# when maturin's template changes.
#
# The two libraries version and release independently, so tags are prefixed:
#   chronoloom-v0.1.0    -> publishes the Rust crate to crates.io
#   chronoloompy-v0.1.0  -> builds wheels and publishes to PyPI
# An unprefixed `v*` tag intentionally does nothing.
name: cd

on:
  push:
    branches: [main]
    tags: ["chronoloom-v*", "chronoloompy-v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: x86
          - runner: ubuntu-22.04
            target: aarch64
          - runner: ubuntu-22.04
            target: armv7
          - runner: ubuntu-22.04
            target: s390x
          - runner: ubuntu-22.04
            target: ppc64le
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: chronoloompy
          target: ${{ matrix.platform.target }}
          args: --release --out dist --manifest-path rust/Cargo.toml
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: chronoloompy/dist

  musllinux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: x86
          - runner: ubuntu-22.04
            target: aarch64
          - runner: ubuntu-22.04
            target: armv7
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: chronoloompy
          target: ${{ matrix.platform.target }}
          args: --release --out dist --manifest-path rust/Cargo.toml
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: musllinux_1_2
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: chronoloompy/dist

  windows:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
            python_arch: x64
          - runner: windows-latest
            target: x86
            python_arch: x86
          - runner: windows-11-arm
            target: aarch64
            python_arch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          architecture: ${{ matrix.platform.python_arch }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: chronoloompy
          target: ${{ matrix.platform.target }}
          args: --release --out dist --manifest-path rust/Cargo.toml
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: chronoloompy/dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: chronoloompy
          target: ${{ matrix.platform.target }}
          args: --release --out dist --manifest-path rust/Cargo.toml
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: chronoloompy/dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: chronoloompy
          command: sdist
          args: --out dist --manifest-path rust/Cargo.toml
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: chronoloompy/dist

  release-pypi:
    name: Release chronoloompy to PyPI
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/chronoloompy-v') || github.event_name == 'workflow_dispatch' }}
    needs: [linux, musllinux, windows, macos, sdist]
    permissions:
      id-token: write # trusted publishing to PyPI
      contents: write # upload release artifacts
      attestations: write # artifact attestation
    steps:
      - uses: actions/download-artifact@v8
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: "wheels-*/*"
      - name: Install uv
        if: ${{ startsWith(github.ref, 'refs/tags/chronoloompy-v') }}
        uses: astral-sh/setup-uv@v10.0.1
      - name: Publish to PyPI
        if: ${{ startsWith(github.ref, 'refs/tags/chronoloompy-v') }}
        run: uv publish --trusted-publishing always 'wheels-*/*'

  release-crates-io:
    name: Release chronoloom to crates.io
    runs-on: ubuntu-latest
    # Deliberately independent of the wheel chain: the crate and the wheels are
    # separate artifacts on separate tags, so neither blocks the other.
    if: ${{ startsWith(github.ref, 'refs/tags/chronoloom-v') }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: chronoloom
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: chronoloom
      # Requires a CARGO_REGISTRY_TOKEN repository secret (Settings > Secrets
      # and variables > Actions). crates.io versions are permanent, so the
      # ci-chronoloom `package` job dry-runs this on every core change.
      - run: cargo publish --token "$CARGO_REGISTRY_TOKEN"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
