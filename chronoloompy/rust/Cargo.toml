[package]
name = "chronoloompy-ext"
# NOT the release version. maturin builds the wheel from [project].version in
# ../pyproject.toml, which is also what the cd-chronoloompy tag guard checks.
# This one is inert -- the crate is never published anywhere.
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
# Never published to crates.io: this crate's only export is a #[pymodule], so
# it is useless to Rust consumers. It ships as a compiled .so inside PyPI
# wheels, built by maturin. Rust users depend on `chronoloom` directly.
publish = false
# Inert given `publish = false`, but `maturin sdist` runs `cargo package --list`,
# which warns when this metadata is absent. Present only to keep that build
# output clean. The wheel's real metadata comes from ../pyproject.toml.
description = "PyO3 bindings for chronoloom. Implementation detail of the chronoloompy Python package."
license = "MIT"
repository = "https://github.com/AElOuassouli/chronoloom"

[lib]
# Must exactly match the last segment of `module-name` in ../pyproject.toml and
# the #[pymodule] fn name in src/lib.rs, or maturin emits a .so that Python
# cannot import under the expected name.
name = "_core"
# rlib is required for `cargo test` / `cargo clippy --all-targets` to link;
# cdylib is what maturin packages into the Python wheel.
crate-type = ["cdylib", "rlib"]

[dependencies]
# The released crate, NOT the sibling ../../chronoloom directory. Every wheel
# therefore contains core code matching a real published version, and the sdist
# no longer has to vendor a crate from outside this package directory (maturin's
# most bug-prone path -- PyO3/maturin#579, #838).
#
# The trade-off: an edit to ../../chronoloom no longer reaches this binding. To
# expose new core algebra, release the core to crates.io first, then bump this
# requirement.
chronoloom = "0.1"
pyo3 = { version = "0.29.2", features = ["abi3-py312"] }
