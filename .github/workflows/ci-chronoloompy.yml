# CI for the Python library and its pyo3 binding. See the note in
# ci-chronoloom.yml about branch protection and filtered-out workflows.
name: ci-chronoloompy

on:
  # No `push: branches: [main]`. A pull_request check already runs against the
  # merge result, so re-running on main after the merge tests an identical tree.
  # Release commits are pushed straight to main, and cd-chronoloompy.yml calls
  # this workflow directly (below) so they are still covered -- and there the
  # result actually gates publishing, which a parallel push-triggered run could
  # not do.
  pull_request:
    branches: [main]
    paths:
      # No chronoloom/** here: the binding depends on the released crate from
      # crates.io, so an edit to the sibling core directory cannot affect this
      # build. It only matters once rust/Cargo.toml bumps the requirement.
      - "chronoloompy/**"
      - "rust-toolchain.toml"
      - ".github/workflows/ci-chronoloompy.yml"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_LOCKED: "1" # fail instead of silently re-locking a stale uv.lock
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

defaults:
  run:
    working-directory: chronoloompy

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run --no-sync ruff check --output-format=github .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy

  lint-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: chronoloompy/rust
      - run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path rust/Cargo.toml

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: chronoloompy/rust
      - run: uv sync
      - run: uv run --no-sync pytest --cov=chronoloompy --cov-report=xml

  sdist:
    # Kept, though it is no longer the fragile case it was: now that the binding
    # depends on the released chronoloom crate rather than the sibling
    # directory, maturin has no path dep to vendor and the sdist is an ordinary
    # one. This still proves an sdist install compiles the extension from source
    # and can resolve chronoloom from crates.io -- the path every user without a
    # matching wheel takes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run --no-sync maturin sdist --out dist
      - name: Install from the sdist in a clean environment
        working-directory: ${{ github.workspace }}
        run: |
          uv venv /tmp/sdist-check
          # --no-binary forces chronoloompy to be built from the sdist rather
          # than a wheel, while the index still supplies pydantic/numpy.
          VIRTUAL_ENV=/tmp/sdist-check uv pip install \
            --find-links chronoloompy/dist --no-binary chronoloompy chronoloompy
          /tmp/sdist-check/bin/python -c \
            "from chronoloompy import _core; assert _core.intersection((0,5),(3,9)) == (3,5); print('sdist OK')"
