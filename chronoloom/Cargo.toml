[package]
name = "chronoloom"
version = "0.3.1"
edition = "2024"
rust-version = "1.85"
description = "Set algebra, formulas and online processing over time points and intervals."
license = "MIT"
repository = "https://github.com/AElOuassouli/chronoloom"
readme = "README.md"
keywords = ["time-series", "temporal", "interval", "algebra"]
categories = ["date-and-time", "data-structures"]

# The default build has no dependencies: everything below is optional, behind
# the `serde` and `json-schema` features. Never pyo3: Python bindings live in
# ../chronoloompy/rust, which depends on this crate; nothing here may depend on
# them. `make lint` asserts both invariants.
[dependencies]
schemars = { version = "1.2.3", default-features = false, features = ["derive"], optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.154", optional = true }

[features]
serde = ["dep:serde"]
json-schema = ["serde", "dep:schemars", "dep:serde_json"]

[dev-dependencies]
serde_json = "1.0.154"
