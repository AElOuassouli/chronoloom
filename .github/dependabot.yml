# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
#
# Directories match the two-library layout: chronoloom/ is the standalone crate,
# chronoloompy/ is the Python library and chronoloompy/rust/ its pyo3 binding.
# Each cargo manifest has its own lockfile, so each needs its own entry.

version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/chronoloompy" # pyproject.toml + uv.lock
    schedule:
      interval: "weekly"
    groups:
      python-dev:
        dependency-type: "development"

  - package-ecosystem: "cargo"
    directory: "/chronoloom" # standalone crate; must never gain a pyo3 dep
    schedule:
      interval: "weekly"

  - package-ecosystem: "cargo"
    directory: "/chronoloompy/rust" # pyo3 binding
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
