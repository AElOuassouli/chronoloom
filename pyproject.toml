[build-system]
requires = ["maturin>=1.1,<2.0"]
build-backend = "maturin"

[project]
name = "timewarp"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "timewarp._rust_lib"

[tool.poetry]
name = "timewarp"
version = "0.1.0"
description = ""
authors = ["Amine El Ouassouli <a.elouassouli@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
pydantic = "^2.4.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
ruff = "^0.0.282"
black = "^23.7.0"
pytest-cov = "^4.1.0"
pre-commit = "^3.3.3"
maturin = "^1.2.0"

[tool.ruff]
target-version = "py310"

select = ["I"]

[tool.ruff.per-file-ignores]
"__init__.py" = ["E402"]
